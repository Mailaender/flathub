app-id: io.sourceforge.trophy
runtime: org.freedesktop.Platform
runtime-version: 22.08
sdk: org.freedesktop.Sdk
command: trophy
rename-icon: trophy
rename-desktop-file: trophy.desktop
rename-appdata-file: trophy.appdata.xml
finish-args:
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
cleanup:
  - "*.a"
  - "*.la"
  - "/include"
  - "/lib/pkgconfig"

modules:
  - name: clanlib-1.0
    buildsystem: autotools
    config-opts:
      - --disable-docs
      - --disable-static
    sources:
      - type: archive
        url: https://src.fedoraproject.org/repo/pkgs/ClanLib/ClanLib-1.0.0.tgz/281e64a463155474d0f1270686286811/ClanLib-1.0.0.tgz
        sha256: 6047b095f82052eae1305edccc4cd9e8831080ea3d3c92c6e44566a2c42dc5a3

  - name: trophy
    buildsystem: autotools
    post-install:
      - install -Dm0644 trophy.appdata.xml ${FLATPAK_DEST}/share/metainfo/trophy.appdata.xml
      - install -Dm0644 trophy.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/trophy.png
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/trophy/trophy-2.0.4.tar.gz
        tag: 2.0.4
        sha256: e3f6c76bdbb19e4d08f2310b3a0039de575aebfb9c9855e6138c88a0edd476be
      - type: file
        path: trophy.appdata.xml
      - type: file
        path: trophy.png
