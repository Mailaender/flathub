app-id: org.eclipse.theia
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: theia
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --socket=ssh-auth
  - --device=all
  - --allow=devel
  - --filesystem=host
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: libsecret
    buildsystem: meson
    config-opts:
    - -Dgtk_doc=false
    - -Dintrospection=false
    - -Dmanpage=false
    - -Dvapi=false
    cleanup:
    - /bin
    - /include
    - /lib/pkgconfig
    - /share/man
    sources:
    - type: git
      url: https://gitlab.gnome.org/GNOME/libsecret.git
      tag: 0.21.4
      commit: 6b5a6c28afc6dd93c232a4907a87c881079ff91b

  - name: theia
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node20/bin
      env:
        XDG_CACHE_HOME: /run/build/theia/flatpak-node/cache
        ELECTRON_CACHE: /run/build/theia/flatpak-node/cache/electron
        TMPDIR: /run/build/theia/flatpak-node/tmp
        ELECTRON_SKIP_BINARY_DOWNLOAD: 'true'
        PUPPETEER_SKIP_DOWNLOAD: 'true'
        npm_config_nodedir: /usr/lib/sdk/node20
    build-commands:
      - yarn --frozen-lockfile --force
      - unzip -o flatpak-node/cache/electron/electron-v*-linux-*.zip -d node_modules/electron/dist/
      - yarn build:extensions
      - yarn --cwd applications/electron -s rebuild
      - yarn theia build --app-target="browser"
      - yarn theia build --app-target="electron"
      - . flatpak-node/electron-builder-arch-args.sh; yarn --cwd applications/electron electron-builder --dir $ELECTRON_BUILDER_ARCH_ARGS --publish always
      - mv applications/electron/dist/linux-unpacked/ ${FLATPAK_DEST}/lib/theia
      - install -Dm 755 flatpak-node/libffmpeg.so -t ${FLATPAK_DEST}/lib/theia
      - install -Dm 755 start-theia.sh ${FLATPAK_DEST}/bin/theia
    sources:
      - type: git
        url: https://github.com/eclipse-theia/theia-ide.git
        tag: 1.54.0
        commit: ed203687bad53fdbd22012926978ac40d7d8cd23
      # flatpak-node-generator yarn yarn.lock --node-chromedriver-from-electron 28.3.3 --electron-ffmpeg lib
      - generated-sources.json
      - type: inline
        contents: |
          yarn-offline-mirror /run/build/theia/flatpak-node/yarn-mirror
          --install.offline true
          --run.offline true
        dest-filename: .yarnrc
      - type: script
        dest-filename: start-theia.sh
        commands:
          - zypak-wrapper /app/lib/theia/theia-ide-electron-app
