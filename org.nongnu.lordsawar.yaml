app-id: org.nongnu.lordsawar
runtime: org.freedesktop.Platform
runtime-version: 22.08
sdk: org.freedesktop.Sdk
command: lordsawar
rename-icon: lordsawar
rename-desktop-file: lordsawar.desktop
finish-args:
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri

modules:
  - shared-modules/intltool/intltool-0.51.json

  - name: gtkmm
    sources:
      - sha256: 6d71091bcd1863133460d4188d04102810e9123de19706fb656b7bb915b4adc3
        type: archive
        url: https://ftp.gnome.org/pub/GNOME/sources/gtkmm/3.24/gtkmm-3.24.2.tar.xz
    config-opts:
      - --disable-documentation
    cleanup:
      - '*.a'
      - '*.la'
      - /include
      - /lib/gdkmm-3.0
      - /lib/gtkmm-3.0
      - /lib/pkgconfig
      - /man
      - /share/aclocal
      - /share/man
      - /share/pkgconfig

    modules:
      - name: sigc++
        sources:
          - sha256: 0b68dfc6313c6cc90ac989c6d722a1bf0585ad13846e79746aa87cb265904786
            type: archive
            url: https://ftp.gnome.org/pub/GNOME/sources/libsigc++/2.10/libsigc++-2.10.3.tar.xz
        config-opts:
          - --disable-documentation
        cleanup:
          - '*.la'
          - /include/sigc++-2.0
          - /lib/pkgconfig
          - /lib/sigc++-2.0

      - name: glibmm
        sources:
          - sha256: a75282e58d556d9b2bb44262b6f5fb76c824ac46a25a06f527108bec86b8d4ec
            type: archive
            url: https://ftp.gnome.org/pub/GNOME/sources/glibmm/2.64/glibmm-2.64.2.tar.xz
        config-opts:
          - --disable-documentation
        cleanup:
          - '*.la'
          - /include/glibmm-2.4
          - /include/giomm-2.4
          - /lib/glibmm-2.4
          - /lib/giomm-2.4
          - /lib/libglibmm_generate_extra_defs*
          - /lib/pkgconfig

      - name: cairomm
        sources:
          - sha256: a54ada8394a86182525c0762e6f50db6b9212a2109280d13ec6a0b29bfd1afe6
            type: archive
            url: https://ftp.gnome.org/pub/GNOME/sources/cairomm/1.12/cairomm-1.12.0.tar.xz
        config-opts:
          - --disable-documentation
        cleanup:
          - '*.la'
          - /include/cairomm-1.0
          - /lib/cairomm-1.0
          - /lib/pkgconfig

      - name: pangomm
        buildsystem: meson
        sources:
          - type: archive
            url: https://download.gnome.org/sources/pangomm/2.46/pangomm-2.46.2.tar.xz
            sha256: 57442ab4dc043877bfe3839915731ab2d693fc6634a71614422fb530c9eaa6f4
        config-opts:
          - -Dbuild-documentation=false
        cleanup:
          - '*.la'
          - /include/pangomm-1.4
          - /lib/pangomm-1.4
          - /lib/pkgconfig

      - name: atkmm
        sources:
        - sha256: 4c4cfc917fd42d3879ce997b463428d6982affa0fb660cafcc0bc2d9afcedd3a
          type: archive
          url: https://ftp.gnome.org/pub/GNOME/sources/atkmm/2.28/atkmm-2.28.0.tar.xz
        config-opts:
          - --disable-documentation
        cleanup:
          - '*.la'
          - /include/atkmm-1.6
          - /lib/atkmm-1.6
          - /lib/pkgconfig

  - name: libxml++
    config-opts:
      - --disable-documentation
    cleanup:
      - /lib/libxml++-2.6
    sources:
      - type: archive
        url: http://ftp.gnome.org/pub/GNOME/sources/libxml++/2.40/libxml++-2.40.1.tar.xz
        sha256: 4ad4abdd3258874f61c2e2a41d08e9930677976d303653cd1670d3e9f35463e9

  - name: gstreamermm
    build-options:
      cflags: -DGLIB_VERSION_MIN_REQUIRED=GLIB_VERSION_2_66
      cxxflags: -DGLIB_VERSION_MIN_REQUIRED=GLIB_VERSION_2_66
    config-opts:
      - --disable-documentation
    sources:
    - type: archive
      url: https://download.gnome.org/sources/gstreamermm/1.10/gstreamermm-1.10.0.tar.xz
      sha256: be58fe9ef7d7e392568ec85e80a84f4730adbf91fb0355ff7d7c616675ea8d60

  - name: lordsawar
    buildsystem: autotools
    sources:
      - type: archive
        url: http://download.savannah.gnu.org/releases/lordsawar/lordsawar-0.3.2.tar.gz
        sha256: ee9f8f2f0e07595ae5fbdb6259bfbc1fb9c88d17eeda723c8e23428a0bcda7b1
