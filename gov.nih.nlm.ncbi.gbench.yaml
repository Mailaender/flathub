app-id: gov.nih.nlm.ncbi.gbench
runtime: org.freedesktop.Platform
runtime-version: 22.08
sdk: org.freedesktop.Sdk
command: gbench
rename-desktop-file: gbench.desktop
rename-appdata-file: gbench.metainfo.xml
rename-icon: gbench
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network

modules:
  - shared-modules/glu/glu-9.json
  - shared-modules/glew/glew.json

  - name: wxWidgets
    buildsystem: autotools
    config-opts:
      - --with-opengl
      - --enable-shared
      - --disable-monolithic
      - --enable-sockets
      - --enable-unicode
      - --enable-filesystem
      - --enable-fs_inet
    cleanup:
      - /bin
      - /include
      - /lib/wx/include
    sources:
      - type: git
        url: https://github.com/wxWidgets/wxWidgets.git
        tag: v3.1.3
        commit: 8a40d23b27ed1c80b5a2ca9f7e8461df4fbc1a31

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app --with-libraries=regex,system,chrono,iostreams,program_options,serialization,test,thread,filesystem
      - ./b2 -j $FLATPAK_BUILDER_N_JOBS install
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/boost/boost/1.53.0/boost_1_53_0.tar.bz2
        sha256: f88a041b01882b0c9c5c05b39603ec8383fb881f772f6f9e6e6fd0e0cddb9196

  - name: vdb
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/ncbi/ncbi-vdb.git
        tag: 3.0.2
        commit: c4aa19632714c2f04af07505721fb16c71bba3d5

  - name: lzo
    config-opts:
      - --enable-shared
      - --disable-static
    cleanup:
      - /include
      - /lib/*.la
      - /lib/pkgconfig
      - /share
    sources:
      - type: archive
        url: https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
        sha256: c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072

  - name: libdb
    subdir: dist
    builddir: true
    config-opts:
      - --enable-compat185
      - --enable-shared
      - --enable-cxx
      - --enable-dbm
      - --enable-stl
    sources:
      - type: archive
        url: https://download.oracle.com/berkeley-db/db-5.3.28.tar.gz
        sha256: e0a992d740709892e81f9d93f06daf305cf73fb81b545afe72478043172c3628
      - type: patch
        path: atomic.patch
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} dist

  - name: ftgl
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
    - type: git
      url: https://github.com/frankheckenbach/ftgl/
      tag: v2.4.0
      commit: 483639219095ad080538e07ceb5996de901d4e74

  - name: libuv
    buildsystem: autotools
    sources:
    - type: archive
      url: https://dist.libuv.org/dist/v1.44.2/libuv-v1.44.2.tar.gz
      sha256: ccfcdc968c55673c6526d8270a9c8655a806ea92468afcbcabc2b16040f03cb4

  - name: gbench
    buildsystem: autotools
    builddir: build
    config-opts:
      - --with-dll
      - --with-mt
      - --with-gbench
      - --with-vdb=/app
      - --with-boost=/app
      - --with-libxml
      - --with-libxslt
      - --with-sqlite3
      - --with-lzo
      - --with-ftgl=/app
      - --with-wxwidgets=/app
      - --with-wxwidgets-ucs
      - --with-projects=scripts/projects/ncbi_gbench.lst
      - --without-glew-mx
      - --with-bin-release
      - --with-runpath=/app/lib
      - --without-sybase
      - --with-flat-makefile
      - --without-caution
      - --without-internal
      - --with-libuv=/app
      - --with-nghttp2
    sources:
      - type: archive
        url: https://ftp.ncbi.nlm.nih.gov/toolbox/gbench/ver-3.8.2/gbench-src-3.8.2.tar.gz
        sha256: da68fa4e747fc1eac1a55005128bc4505c030b64f7f492473ad9863dcc637b30
