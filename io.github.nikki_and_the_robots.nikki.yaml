app-id: io.github.nikki_and_the_robots.nikki
runtime: org.freedesktop.Platform
runtime-version: '19.08'
sdk: org.freedesktop.Sdk
command: nikki
finish-args:
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri

modules:
  #- qt4/qt4-4.8.7-opengl.json

  - name: haskell
    buildsystem: autotools
    make-args:
      - install
    sources:
      - type: archive
        url: https://downloads.haskell.org/ghc/7.10.2/ghc-7.10.2-x86_64-unknown-linux-deb7.tar.xz
        sha256: 0144791f0cc5ef5991356b3b3a4521da8072dd1c216a48e7d2dfbbdca827cdf1
        only-arches:
          - x86_64
      - type: shell
        commands:
          - mkdir -p /app/lib
          - ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so /app/lib/libtinfo.so.5
    cleanup:
      - '*'

  - name: stack
    buildsystem: simple
    build-commands:
      - install -Dm755 stack ${FLATPAK_DEST}/bin/stack
    sources:
      - type: archive
        url: https://github.com/commercialhaskell/stack/releases/download/v0.1.10.1/stack-0.1.10.1-linux-x86_64.tar.gz
        sha256: 395f41b93012cda4494f4f5d6587ef82056a03b69ad0f7087c3fae49aa30b51a
        only-arches:
          - x86_64
    cleanup:
      - '*'

  - name: FindBin
    buildsystem: simple
    sources:
      - type: archive
        url: https://hackage.haskell.org/package/FindBin-0.0.5/FindBin-0.0.5.tar.gz
        sha256: 279c7967e0803ca3b9a0a1956ce7ba9b9a2294eb9f971bea8a557b5f80ddfda4
    build-commands:
      - runhaskell Setup configure --prefix=${FLATPAK_DEST}
      - runhaskell Setup build
      - runhaskell Setup install
    modules:
      - name: StateVar
        buildsystem: simple
        sources:
        - type: archive
          url: https://hackage.haskell.org/package/StateVar-1.0.0.0/StateVar-1.0.0.0.tar.gz
          sha256: 8445c998f79ef34105ffc928e50f1488505e8801f77f04d4b28d056b8d322bb0
        build-commands:
          - runhaskell Setup configure --prefix=${FLATPAK_DEST}
          - runhaskell Setup build
          - runhaskell Setup install

  - name: Hipmunk
    buildsystem: simple
    sources:
      - type: archive
        url: https://hackage.haskell.org/package/Hipmunk-5.2.0.17/Hipmunk-5.2.0.17.tar.gz
        sha256: 48110b843cc660fa41c9521d9f57e61acd26cce99af94dff7865ac7fd30ebafb
    build-commands:
      - runhaskell Setup configure --prefix=${FLATPAK_DEST}
      - runhaskell Setup build
      - runhaskell Setup install

  - name: RSA
    buildsystem: simple
    sources:
      - type: archive
        url: https://hackage.haskell.org/package/RSA-1.2.1.0/RSA-1.2.1.0.tar.gz
        sha256: 8a053ddce835c5ec75e69147f7522a132c68c21235fb696c7c0d67e2651fa593
    build-commands:
      - runhaskell Setup configure --prefix=${FLATPAK_DEST}
      - runhaskell Setup build
      - runhaskell Setup install

  - name: binary-communicator
    buildsystem: simple
    sources:
      - type: archive
        url: https://hackage.haskell.org/package/binary-communicator-1.0.2.2/binary-communicator-1.0.2.2.tar.gz
        sha256: 68c267c40d08bb0a574a35bb8bc2eab06172e1084fbf1fdeeb2d7015a9e56cf0
    build-commands:
      - runhaskell Setup configure --prefix=${FLATPAK_DEST}
      - runhaskell Setup build
      - runhaskell Setup install

  - name: clocked
    buildsystem: simple
    sources:
      - type: archive
        url: https://hackage.haskell.org/package/clocked-0.4.1.3/clocked-0.4.1.3.tar.gz
        sha256: 287272104ea5944b9c3c89178e5995838f61cceb31ab0319a77f1ca5a32536fd
    build-commands:
      - runhaskell Setup configure --prefix=${FLATPAK_DEST}
      - runhaskell Setup build
      - runhaskell Setup install

  - name: crypto-pubkey-types
    buildsystem: simple
    sources:
      - type: archive
        url: https://hackage.haskell.org/package/crypto-pubkey-types-0.1.1/crypto-pubkey-types-0.1.1.tar.gz
        sha256: 2bce552b0aa45f2457e4d6ab369777114465b0a9fba455e64ad0766a03f81432
    build-commands:
      - runhaskell Setup configure --prefix=${FLATPAK_DEST}
      - runhaskell Setup build
      - runhaskell Setup install

  - name: network-fancy
    buildsystem: simple
    sources:
      - type: archive
        url: https://hackage.haskell.org/package/network-fancy-0.2.4/network-fancy-0.2.4.tar.gz
        sha256: 4936ea7f980768a66656332f7211b1877af4b387ad5c81ab3dde76b3eb76df57
    build-commands:
      - runhaskell Setup configure --prefix=${FLATPAK_DEST}
      - runhaskell Setup build
      - runhaskell Setup install

  - name: stickyKeysHotKey
    buildsystem: simple
    sources:
      - type: archive
        url: https://hackage.haskell.org/package/stickyKeysHotKey-0.1.0.2/stickyKeysHotKey-0.1.0.2.tar.gz
        sha256: 4a24a2e53b818937b3b75ea97df65bd4448444fe7d4dc6e6fa3c13a7878a8147
    build-commands:
      - runhaskell Setup configure --prefix=${FLATPAK_DEST}
      - runhaskell Setup build
      - runhaskell Setup install

  - name: bindings-libzip
    buildsystem: simple
    sources:
      - type: archive
        url: https://hackage.haskell.org/package/bindings-libzip-1.0.1/bindings-libzip-1.0.1.tar.gz
        sha256: 908d060360d66974b1d9400dea28a1dce35a88baf5d73a6e3c12be8e74cda2ec
    build-commands:
      - runhaskell Setup configure --prefix=${FLATPAK_DEST}
      - runhaskell Setup build
      - runhaskell Setup install

  - name: LibZip
    buildsystem: simple
    sources:
      - type: archive
        url: https://hackage.haskell.org/package/LibZip-1.0.1/LibZip-1.0.1.tar.gz
        sha256: a636e0202d2a3f60d894a814bd9834cf8c62313b67ccc48c295f02a4bebe425f
    build-commands:
      - runhaskell Setup configure --prefix=${FLATPAK_DEST}
      - runhaskell Setup build
      - runhaskell Setup install

  - name: nikki
    buildsystem: simple
    subdir: src
    build-commands:
      - ./build-qtwrapper.sh
      - stack setup --resolver=lts-3.22
      - stack build --resolver=lts-3.22
      - ./linuxDeploy.hs --no-copy-shared-objects
    sources:
      - type: git
        url: https://github.com/nikki-and-the-robots/nikki
        tag: 1.1.1
        commit: 0bef26a489b465856156c971c0b057dab8f32c2d
