app-id: org.jedit.jEdit
runtime: org.freedesktop.Platform
runtime-version: '21.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk11
command: jedit
finish-args:
  - --share=network
  - --socket=x11
  - --share=ipc
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre
  - --filesystem=home
modules:
  - name: jedit
    buildsystem: simple
    build-options:
      env:
        PATH: /app/bin:/usr/bin:/usr/lib/sdk/openjdk11/bin
        JAVA_HOME: /usr/lib/sdk/openjdk11/jvm/openjdk-11
    build-commands:
      - ant -Divy.local.default.root=/run/build/jedit/.ivy2/local
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/jedit/jedit/5.6.0/jedit5.6.0source.tar.bz2
        sha256: 76c16ae0168d9b64ecddd8bf08aa49ab352adb2c9687191bc71895a96a8dfe1d
      - maven-dependencies.yaml

    modules:
      - name: openjdk
        buildsystem: simple
        build-commands:
          - /usr/lib/sdk/openjdk11/install.sh
