app-id: uk.org.knightsgame.Knights
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: knightsgame
finish-args:
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
cleanup:
  - "*.a"
  - "/bin"
  - "/include"
  - "/lib/pkgconfig"
  - "/man"

modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=filesystem,system,thread
      - ./b2 -j${FLATPAK_BUILDER_N_JOBS} install variant=release --layout=system
    sources:
      - type: archive
        url: http://downloads.sourceforge.net/boost/boost/1.57.0/boost_1_57_0.tar.bz2
        sha256: 910c8c022a33ccec7f088bd65d4f14b466588dda94ba2124e78b8c57db264967

  - name: enet
    buildsystem: autotools
    sources:
        - type: archive
          url: http://enet.bespin.org/download/enet-1.3.17.tar.gz
          sha256: a38f0f194555d558533b8b15c0c478e946310022d0ec7b34334e19e4574dcedc

  - name: lua++
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS MYCFLAGS="$CXXFLAGS -fPIC" MYLDFLAGS="$LDFLAGS" CC=g++ LUA_A=liblua-c++.a LUA_SO=liblua-c++.so linux-readline
      - make TO_LIB=liblua-c++.so INSTALL_TOP=$FLATPAK_DEST install
      - install -Dm644 lua-c++.pc ${FLATPAK_DEST}/lib/pkgconfig/lua-c++.pc
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.4.6.tar.gz
        sha256: 7d5ea1b9cb6aa0b59ca3dde1c6adcb57ef83a1ba8e5432c0ecd06bf439b3ad88
      - type: patch
        path: liblua.so.patch
      - type: file
        path: lua-c++.pc

  - name: knightsgame
    buildsystem: autotools
    no-autogen: true
    make-args:
      - PREFIX=${FLATPAK_DEST}
    make-install-args:
      - PREFIX=${FLATPAK_DEST}
    sources:
      - type: archive
        url: https://www.knightsgame.org.uk/files/knights_027_src.tar.gz
        sha256: b344315a56d20b7de537de8d9aea3207127629b4a94915187653e260b35f99fd
