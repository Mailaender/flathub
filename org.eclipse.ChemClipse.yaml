app-id: org.eclipse.ChemClipse
runtime: org.freedesktop.Platform
runtime-version: 23.08
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17

command: chemclipse
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --persist=.chemclipse
  - --persist=.eclipseswtchartsettings
  - --filesystem=home

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk17/install.sh

  - name: chemclipse
    buildsystem: simple
    build-commands:
      - mv chemclipse ${FLATPAK_DEST}/chemclipse/
      - mkdir -p ${FLATPAK_DEST}/bin
      - ln -sf ${FLATPAK_DEST}/chemclipse/chemclipse ${FLATPAK_DEST}/bin/
      - ln -sf ${FLATPAK_DEST}/jre/ ${FLATPAK_DEST}/chemclipse/
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: archive
        url: https://ci.eclipse.org/chemclipse/job/chemclipse/job/develop/lastSuccessfulBuild/artifact/chemclipse/products/org.eclipse.chemclipse.rcp.compilation.community.product/target/products/org.eclipse.chemclipse.rcp.compilation.community.product.id-linux.gtk.x86_64.tar.gz
        sha256: 16b267e7de7150c91818c12ded35d69ed647403996c3d9880b439aff4caf600e
        strip-components: 0
        dest: chemclipse
      - type: shell
        commands:
          - rm chemclipse/plugins/com.sun.jna_5.13.0.v20230812-1000/com/sun/jna/sunos-sparcv9/libjnidispatch.so
          - rm chemclipse/plugins/com.sun.jna_5.13.0.v20230812-1000/com/sun/jna/sunos-sparc/libjnidispatch.so
      - type: file
        path: org.eclipse.ChemClipse.desktop
      - type: file
        path: org.eclipse.ChemClipse.svg
