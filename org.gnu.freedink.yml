app-id: org.gnu.freedink
runtime: org.freedesktop.Platform
runtime-version: '21.08'
sdk: org.freedesktop.Sdk
command: freedink
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --device=dri

modules:
  - name: sdl2gfx
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://downloads.sf.net/sdl2gfx/SDL2_gfx-1.0.4.tar.gz
        sha256: 63e0e01addedc9df2f85b93a248f06e8a04affa014a835c2ea34bfe34e576262

  - name: glm
    buildsystem: simple
    build-commands:
      - cp -r glm /app/include
    sources:
      - type: archive
        url: https://github.com/g-truc/glm/releases/download/0.9.9.8/glm-0.9.9.8.zip
        sha256: 37e2a3d62ea3322e43593c34bae29f57e3e251ea89f4067506c94043769ade4c
        x-checker-data:
          type: anitya
          project-id: 1181
          url-template: https://github.com/g-truc/glm/releases/download/$version/glm-$version.zip

  - name: freedink
    buildsystem: autotools
    config-opts:
      - --disable-tests
    sources:
      - type: archive
        url: ftp://ftp.gnu.org/gnu/freedink/freedink-109.6.tar.gz
        sha256: 5e0b35ac8f46d7bb87e656efd5f9c7c2ac1a6c519a908fc5b581e52657981002

